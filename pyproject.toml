[tool.poetry]
name = "quito-transport-platform"
version = "0.1.0"
description = "Public transport analytics platform for Quito's BRT network (Trole, Ecovía, Metrobús)"
authors = ["bernabecj"]
license = "MIT"
readme = "README.md"
packages = [{ include = "ingestion" }, { include = "processing" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
requests = "^2.32"
boto3 = "^1.34"
pyarrow = "^18.0"
pandas = "^2.2"
great-expectations = "^0.18"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
black = "^24.4"
isort = "^5.13"

[tool.poetry.group.processing.dependencies]
pyspark = "^3.5"

[tool.poetry.group.dbt.dependencies]
dbt-core = "^1.8"
dbt-redshift = "^1.8"

[tool.poetry.group.airflow]
optional = true

[tool.poetry.group.airflow.dependencies]
apache-airflow = { version = "^2.9", extras = ["amazon"] }

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ingestion --cov=processing --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
