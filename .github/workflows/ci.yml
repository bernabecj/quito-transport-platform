name: CI

on:
    workflow_dispatch:

jobs:
    lint-and-test:
        name: Lint & Unit Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Poetry
              uses: snok/install-poetry@v1
              with:
                  virtualenvs-create: true
                  virtualenvs-in-project: true

            - name: Cache virtualenv
              uses: actions/cache@v4
              with:
                  path: .venv
                  key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

            - name: Install dependencies
              run: poetry install --with dev --with airflow

            # Poetry keeps the virtualenv in-project (poetry.toml), so commands run
            # from it directly, the same way they do locally with .venv activated.
            - name: Put the virtualenv on PATH
              run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

            - name: Run pytest
              run: pytest

    dbt-tests:
        name: dbt Tests
        runs-on: ubuntu-latest
        needs: lint-and-test
        env:
            DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Poetry
              uses: snok/install-poetry@v1
              with:
                  virtualenvs-create: true
                  virtualenvs-in-project: true

            - name: Cache virtualenv
              uses: actions/cache@v4
              with:
                  path: .venv
                  key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

            - name: Install dbt dependencies
              run: poetry install --with dbt

            - name: Put the virtualenv on PATH
              run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

            - name: dbt deps
              run: dbt deps --project-dir dbt/

            - name: dbt test
              run: dbt test --project-dir dbt/

    great-expectations:
        name: Data Quality Suite
        runs-on: ubuntu-latest
        needs: lint-and-test
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Poetry
              uses: snok/install-poetry@v1
              with:
                  virtualenvs-create: true
                  virtualenvs-in-project: true

            - name: Cache virtualenv
              uses: actions/cache@v4
              with:
                  path: .venv
                  key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

            - name: Install dependencies
              run: poetry install --with dev

            - name: Put the virtualenv on PATH
              run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

            # Validates the committed samples under data/samples/ against every suite
            # in quality/expectations/. No credentials, no network. The checkpoint
            # is defined in quality/checkpoints/raw_samples_checkpoint.yml; rename
            # them together.
            - name: Run Great Expectations suites
              run: great_expectations checkpoint run raw_samples_checkpoint

            # Data Docs show which rows failed and why; keep them when the gate fails.
            - name: Upload Data Docs
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: great-expectations-data-docs
                  path: gx/uncommitted/data_docs/local_site/
                  if-no-files-found: ignore
