version: 2

models:
  - name: fct_route_stops
    description: "Fact table — one row per route-stop pair per snapshot date."
    columns:
      - name: route_id
        description: "Foreign key to dim_routes."
        tests:
          - not_null
          - relationships:
              to: ref('dim_routes')
              field: route_id
      - name: stop_id
        description: "Foreign key to dim_stops."
        tests:
          - not_null
          - relationships:
              to: ref('dim_stops')
              field: stop_id
      - name: stop_sequence
        description: "Position of the stop along the route. Ordering only — OSM carries no timetable, so this is not a departure order."
      - name: snapshot_date
        description: "Date the network was captured from Overpass. Enables tracking network change over time."
        tests:
          - not_null

  - name: dim_routes
    description: "All Quito transit routes — Trole, Ecovía, Metrobús and the private cooperatives."
    columns:
      - name: route_id
        description: "OpenStreetMap relation ID for the route."
        tests:
          - not_null
          - unique
      - name: operator
        description: "Operating company as tagged in OSM. Null for roughly 6% of routes."

  - name: dim_stops
    description: "Transit stops with OSM coordinates, shelter tag and neighbourhood."
    columns:
      - name: stop_id
        description: "OpenStreetMap node ID for the stop."
        tests:
          - not_null
          - unique
      - name: shelter
        description: "Whether the stop has a shelter, per OSM tagging. Populated for only ~1% of stops, so it is carried through for completeness but not used in any metric."

  - name: dim_weather_conditions
    description: "OpenWeather condition code lookup table."
    columns:
      - name: condition_id
        tests:
          - not_null
          - unique

  - name: fct_corridor_travel_time
    description: "Fact table — observed travel time per trunk BRT corridor per sample. Grain is route_id x sampled_at."
    columns:
      - name: route_id
        description: "Foreign key to dim_routes."
        tests:
          - not_null
          - relationships:
              to: ref('dim_routes')
              field: route_id
      - name: sampled_at
        description: "UTC timestamp of the sample."
        tests:
          - not_null
      - name: local_hour
        description: "Hour of day in Quito time (UTC-5). The grouping key for peak-hour analysis."
      - name: duration_seconds
        description: "Observed traversal time. Baselines are derived from each corridor's own history rather than a free-flow profile, which measured faster than live traffic and would report negative delay."
      - name: mean_speed_kmh
        description: "Corridor distance divided by observed duration."
      - name: congestion_known_pct
        description: "Share of route segments where Mapbox reported real congestion rather than 'unknown'. Ranged 27-78% at capture; low values mean the sample rests on sparse observation."
      - name: mean_hop_km
        description: "Average distance between consecutive stops. Corridors above 1 km are excluded at ingestion as having non-geographic member order in OSM."
