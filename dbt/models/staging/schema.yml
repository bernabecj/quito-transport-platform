version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: network_routes
        description: "Raw OSM transit route relations loaded from S3 via Redshift COPY."
      - name: network_stops
        description: "Raw OSM stop nodes with coordinates, names and shelter tags."
      - name: network_route_stops
        description: "Raw bridge records linking routes to the stops they serve, in order."
      - name: weather
        description: "Raw OpenWeather API responses for Quito coordinates."
      - name: corridor_travel_time
        description: "Raw Mapbox driving-traffic samples: observed travel time per trunk BRT corridor, one row per corridor per sample."

models:
  - name: stg_routes
    description: "Cleaned and typed OSM transit route records."
    columns:
      - name: route_id
        description: "Unique identifier for a transit route."
        tests:
          - not_null
          - unique

  - name: stg_stops
    description: "Cleaned OSM stop records with validated coordinates."
    columns:
      - name: stop_id
        description: "Unique identifier for a transit stop."
        tests:
          - not_null
          - unique

  - name: stg_weather
    description: "Cleaned weather observations aligned to Quito timezone."
    columns:
      - name: observed_at
        description: "Timestamp of the weather observation (UTC-5)."
        tests:
          - not_null

  - name: stg_corridor_travel_time
    description: "Cleaned corridor travel-time samples with local time buckets."
    columns:
      - name: route_id
        description: "Foreign key to dim_routes."
        tests:
          - not_null
      - name: sampled_at
        description: "UTC timestamp of the sample."
        tests:
          - not_null
      - name: duration_seconds
        description: "Observed traversal time for the whole corridor."
        tests:
          - not_null
