version: "3.9"

services:
  metabase:
    image: metabase/metabase:latest
    container_name: quito-transport-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: "${MB_DB_PASSWORD}"
      MB_DB_HOST: db
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: quito-transport-metabase-db
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: "${MB_DB_PASSWORD}"
    volumes:
      - metabase_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  metabase_db_data:
